name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Node unit tests (scripts/*.test.mjs)
        working-directory: .
        run: |
          shopt -s nullglob
          tests=(scripts/*.test.mjs)
          if [ ${#tests[@]} -gt 0 ]; then node --test "${tests[@]}"; else echo "no Node unit tests"; fi

  ci-gate:
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        run: |
          [ "${{ needs.backend.result }}" = success ] && [ "${{ needs.frontend.result }}" = success ] \
            || { echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"; exit 1; }
